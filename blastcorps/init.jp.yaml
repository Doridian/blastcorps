options:
  base_path: .
  basename: init.jp
  compiler: IDO
  create_detected_syms: yes
  find_file_boundaries: yes
  target_path: init.jp.bin
  symbol_addrs_path: symbol_addrs.init.jp.txt
  undefined_funcs_auto_path: undefined_funcs_auto.init.jp.txt
  undefined_syms_auto_path: undefined_syms_auto.init.jp.txt
  src_path: src.jp
segments:
  - name:  init
    type:  code
    vram:  0x8021ED00
    start: 0x00000000
    subsegments:
    - [0x00000, c, init/00000]
    - [0x1660, c, init/1660]
    - [0x1A00, c, init/1A00]
    - [0x1A30, c, init/1A30]
    - [0x1F40, c, init/1F40]
    - [0x2260, c, init/2260]
    - [0x2280, c, init/2280]
    - [0x2C20, c, init/2C20]
    - [0x2CA0, c, init/2CA0]
    - [0x2D00, c, init/2D00]
    - [0x3060, c, init/3060]
    - [0x30E0, c, init/30E0]
    - [0x38D0, c, init/38D0]
    - [0x3990, c, init/3990]
    - [0x39A0, c, init/39A0]
    - [0x3A00, c, init/3A00]
    - [0x3A40, linker, data]
    - [0x3A40, bin, init/init_data] # .data
  - [0x3CE0] # EOF
