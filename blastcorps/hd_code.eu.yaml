options:
  base_path: .
  basename: hd_code.eu
  compiler: IDO
  create_detected_syms: yes
  find_file_boundaries: yes
  target_path: hd_code.eu.bin
  undefined_funcs_auto_path: undefined_funcs_auto.hd_code.eu.txt
